<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Custom dropdown</title></head>
<body>
  <form id="form">
    <label for="name">Full name</label>
    <input id="name" name="name">
    <label for="email">Email</label>
    <input id="email" name="email" type="email">
    <label id="wa-label" for="wa">Work authorization</label>
    <button type="button" id="wa" role="combobox" aria-labelledby="wa-label" aria-expanded="false">Select…</button>
    <ul id="wa-list" role="listbox" hidden>
      <li role="option">Authorized to work</li>
      <li role="option">Not authorized</li>
    </ul>
    <input type="hidden" id="work_auth" name="work_auth" value="">
    <label for="resume">Resume</label>
    <input id="resume" type="file">
    <label for="cover">Why do you want this role?</label>
    <textarea id="cover"></textarea>
    <button type="submit">Submit application</button>
  </form>
  <script>
    const btn = document.getElementById('wa');
    const list = document.getElementById('wa-list');
    btn.onclick = () => {
      list.hidden = !list.hidden;
      btn.setAttribute('aria-expanded', String(!list.hidden));
    };
    list.querySelectorAll('[role=option]').forEach(opt => {
      opt.onclick = () => {
        btn.textContent = opt.textContent;
        document.getElementById('work_auth').value = opt.textContent.includes('Authorized') ? 'yes' : 'no';
        list.hidden = true;
      };
    });
    document.getElementById('form').onsubmit = (e) => { e.preventDefault(); location.href = '/confirmation.html'; };
  </script>
</body></html>
