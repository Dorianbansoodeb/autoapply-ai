<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Upload mock</title>
  <style>
    body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, textarea { width: 100%; padding: 0.4rem; margin-top: 0.25rem; }
    button { margin-top: 1.5rem; padding: 0.6rem 1.2rem; }
  </style>
</head>
<body>
  <h1>Upload your resume</h1>
  <form action="/submit" method="post" enctype="multipart/form-data">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
    <label for="resume">Resume</label>
    <input id="resume" name="resume" type="file" accept=".pdf,.docx,.txt">
    <label for="cover">Why do you want this role?</label>
    <textarea id="cover" name="cover" rows="4"></textarea>
    <button type="submit" id="submit">Submit application</button>
  </form>
</body>
</html>
